services:
  cipher-toolkit:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - SERVE_FRONTEND=1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

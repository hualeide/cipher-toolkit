name: 功能建议
description: 新算法、识别改进、文档
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案（可选）
  - type: checkboxes
    id: willing
    attributes:
      label: 是否愿意提交 PR？
      options:
        - label: 我可以自己实现并提 PR
